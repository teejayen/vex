# The built-in taxonomy, used when a library root has no taxonomy.toml of its own.
#
# Copy this file to <root>/taxonomy.toml and edit it to suit what your own library is
# actually full of. Categories are offered to the model in the order they appear here.
#
# Per category:
#   name        lowercase slug; it becomes a directory name under notes/ and views/
#   description one or two sentences telling the model what belongs here
#   structured  optional, "recipe" or "use-note"; what extra field the model fills in
#   purgeable   whether an original may be deleted once its note and thumbnail exist
#   strong      phrases that are close to decisive for the keyword tier
#   weak        phrases that only count together
#   tags        tags added to anything the keyword tier files here
#
# "junk" and "other" are required: every capture has to have somewhere to land.

[[category]]
name = "recipe"
description = "A food recipe: ingredient list, method steps, a recipe card or a cooking post."
structured = "recipe"
purgeable = false
strong = [
    "ingredients",
    "preheat the oven",
    "tablespoons",
    "teaspoons",
    "finely chopped",
    "recipe",
]
weak = [
    "tbsp",
    "tsp",
    "serves",
    "bake",
    "oven",
    "simmer",
    "whisk",
    "dough",
    "marinate",
    "saucepan",
    "olive oil",
    "salt and pepper",
    "cook for",
]
tags = ["recipe", "cooking"]

